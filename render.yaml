# Blueprint de Render: servicio web (Docker, plan free) + Postgres free.
services:
  - type: web
    name: sisalert
    runtime: docker
    plan: free
    healthCheckPath: /api/salud
    envVars:
      # Cadena de conexión de Neon (rama 'produccion'); se pega en el panel de Render.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: TZ
        value: America/Bogota
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        value: admin@avanzar.local
      # Valor por defecto DOCUMENTADO: Admin2026! -> cámbielo en el panel de Render o desde la app tras el primer ingreso.
      - key: ADMIN_PASSWORD
        value: Admin2026!
      - key: APP_URL
        sync: false   # p. ej. https://sisalert.onrender.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CALLMEBOT_ENABLED
        value: "true"
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
